<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentAI - Advanced Text Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>Sentiment<span class="gradient-text">AI</span></h1>
            <p>Analyze the emotion behind any text, from a single sentence to an entire book.</p>
        </header>

        <main class="glass-panel">
            <div class="input-section">
                <div class="tabs">
                    <button class="tab-btn active" id="tab-text">Text Input</button>
                    <button class="tab-btn" id="tab-file">Upload File</button>
                </div>

                <div class="input-container" id="text-input-container">
                    <textarea id="review-text" placeholder="Type or paste your text here..."></textarea>
                </div>

                <div class="input-container hidden" id="file-input-container">
                    <div class="file-drop-area" id="file-drop-area">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                        <p>Drag and drop a .txt file here, or click to browse</p>
                        <input type="file" id="file-upload" accept=".txt, .csv, .md" class="file-input">
                    </div>
                    <p class="file-name" id="file-name-display"></p>
                </div>

                <button id="analyze-btn" class="primary-btn">
                    <span class="btn-text">Analyze Sentiment</span>
                    <div class="spinner hidden"></div>
                </button>
            </div>

            <div class="result-section hidden" id="result-section">
                <h2>Analysis Result</h2>
                <div class="sentiment-badge" id="sentiment-badge">
                    <span class="icon"></span>
                    <span class="text">Positive</span>
                </div>
                <div class="result-details">
                    <p><strong>Processed Text Length:</strong> <span id="text-length">0</span> characters</p>
                </div>
                <button id="reset-btn" class="secondary-btn">Analyze Another</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
